<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kart Rush · 极速卡丁</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-layer"></div>
    <div id="split-line" class="hidden"></div>

    <!-- Menu -->
    <div id="menu" class="overlay">
      <div class="menu-card">
        <div class="logo">
          <div class="logo-main">KART<span>RUSH</span></div>
          <div class="logo-sub">极 速 卡 丁</div>
        </div>
        <div class="opt">
          <label>赛道</label>
          <div class="tracks" id="tracks"></div>
        </div>
        <div class="opt-row">
          <div class="opt">
            <label>模式</label>
            <div class="seg" id="mode">
              <button data-v="0" class="on">竞速赛</button><button data-v="1">道具赛</button>
            </div>
          </div>
          <div class="opt">
            <label>玩家</label>
            <div class="seg" id="players">
              <button data-v="1" class="on">单人</button><button data-v="2">双人分屏</button>
            </div>
          </div>
        </div>
        <div class="opt-row">
          <div class="opt">
            <label>难度</label>
            <div class="seg" id="diff">
              <button data-v="0">休闲</button><button data-v="1" class="on">标准</button><button data-v="2">车神</button>
            </div>
          </div>
          <div class="opt">
            <label>圈数</label>
            <div class="seg" id="laps">
              <button data-v="1">1</button><button data-v="3" class="on">3</button><button data-v="5">5</button>
            </div>
          </div>
        </div>
        <div class="opt">
          <label id="color-label">赛车涂装</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="opt hidden" id="color2-row">
          <label>2P 涂装</label>
          <div class="swatches" id="swatches2"></div>
        </div>
        <button id="start-btn" class="big-btn">开始比赛 <span>ENTER</span></button>
        <button id="online-btn" class="online-btn">🌐 联机对战 <small>和朋友在不同设备上一起玩</small></button>
        <div class="controls" id="controls"></div>
        <div class="tips" id="tips"></div>
      </div>
    </div>

    <!-- Online lobby -->
    <div id="lobby" class="overlay hidden">
      <div class="menu-card lobby-card">
        <div class="lobby-head"><h2>🌐 联机对战</h2><span id="net-status" class="net-status"></span></div>
        <div id="lobby-join">
          <div class="opt">
            <label>昵称</label>
            <input id="nick" class="text-in" maxlength="12" placeholder="输入你的昵称" autocomplete="off" />
          </div>
          <button class="big-btn" id="create-room">创建房间</button>
          <div class="join-row">
            <input id="room-code" class="text-in code-in" maxlength="4" placeholder="房间码" autocomplete="off" />
            <button class="ghost-btn" id="join-room">加入房间</button>
          </div>
          <button class="ghost-btn" id="lobby-back">返回主菜单</button>
          <div class="tips">创建房间后点“复制邀请链接”发给朋友，朋友打开链接、填好昵称就能加入。最多 6 人，空位可以用 AI 补满。</div>
        </div>
        <div id="lobby-room" class="hidden">
          <div class="room-code-row">
            <div>
              <label>房间码</label>
              <div class="room-code" id="room-code-show">----</div>
            </div>
            <button class="ghost-btn" id="copy-link">复制邀请链接</button>
          </div>
          <ul class="room-players" id="room-players"></ul>
          <div class="opt">
            <label>我的涂装</label>
            <div class="swatches" id="room-swatches"></div>
          </div>
          <div id="room-settings">
            <div class="opt">
              <label>赛道</label>
              <div class="seg" id="r-track"></div>
            </div>
            <div class="opt-row">
              <div class="opt">
                <label>模式</label>
                <div class="seg" id="r-mode"><button data-v="0">竞速赛</button><button data-v="1">道具赛</button></div>
              </div>
              <div class="opt">
                <label>圈数</label>
                <div class="seg" id="r-laps"><button data-v="1">1</button><button data-v="3">3</button><button data-v="5">5</button></div>
              </div>
              <div class="opt">
                <label>AI 补位</label>
                <div class="seg" id="r-ai"><button data-v="1">开</button><button data-v="0">关</button></div>
              </div>
            </div>
          </div>
          <button class="big-btn" id="room-start">开始比赛</button>
          <div class="room-wait hidden" id="room-wait">等待房主开始比赛…</div>
          <button class="ghost-btn" id="room-leave">离开房间</button>
        </div>
        <div class="lobby-err" id="lobby-err"></div>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="menu-card small">
        <h2>暂停</h2>
        <button class="big-btn" id="resume-btn">继续</button>
        <button class="ghost-btn" id="restart-btn">重新开始</button>
        <button class="ghost-btn" id="menu-btn">返回主菜单</button>
      </div>
    </div>

    <div id="results" class="overlay hidden">
      <div class="menu-card">
        <h2 id="result-title">比赛结束</h2>
        <table id="result-table"></table>
        <div class="row">
          <button class="big-btn" id="again-btn">再来一局</button>
          <button class="ghost-btn" id="menu-btn2">主菜单</button>
        </div>
      </div>
    </div>

    <div id="loading">LOADING…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
